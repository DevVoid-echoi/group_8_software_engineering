<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Cho & Nhận</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/auth.css">
  <script type="module" src="../js/pages/login.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Đăng nhập</h1>
      <p class="auth-subtitle">Đăng nhập để đăng đồ và liên hệ nhận đồ.</p>

      <form id="login-form" novalidate>
        <div class="form-alert" hidden></div>

        <div class="field" data-field="email">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 aria-describedby="email-error">
          <p class="field-error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field" data-field="password">
          <label for="password">Mật khẩu</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   required aria-describedby="password-error">
            <button type="button" class="toggle-password" data-target="password"
                    aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
          </div>
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      </form>

      <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </section>
  </main>
</body>
</html>
